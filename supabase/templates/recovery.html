<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fff8f0;font-family:Arial,sans-serif;color:#0d1b3e;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#fff8f0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:16px;padding:32px;box-shadow:0 8px 24px rgba(13,27,62,.08);">
            <tr>
              <td>
                <div style="font-size:24px;font-weight:800;color:#0d1b3e;margin-bottom:20px;">
                  <span style="color:#f97316;">D</span>RONN<span style="color:#f97316;">A</span>
                </div>
                <h1 style="font-size:22px;line-height:1.3;margin:0 0 12px;">Reset your password</h1>
                <p style="font-size:15px;line-height:1.6;color:#526173;margin:0 0 24px;">
                  Enter this verification code on the Dronna login page:
                </p>
                <div style="background:#fff3e8;border:1px solid #fed7aa;border-radius:12px;color:#0d1b3e;font-size:32px;font-weight:800;letter-spacing:8px;padding:18px;text-align:center;">
                  {{ .Token }}
                </div>
                <p style="font-size:13px;line-height:1.6;color:#64748b;margin:24px 0 0;">
                  This code is single-use and expires automatically. If you did not request a password reset, you can safely ignore this email. Never share this code with anyone.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
